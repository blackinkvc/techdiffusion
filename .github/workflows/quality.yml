name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install networkx numpy scipy

      - name: Rebuild derived data
        run: |
          node analysis-engine/dump_data.js
          python analysis-engine/phase2_score.py --scope full
          python analysis-engine/phase2_score.py --scope mainline
          python analysis-engine/validate_final.py
          node analysis-engine/build_full_dataset.js
          node analysis-engine/forecast_engine.js
          node analysis-engine/backtest_engine.js --as-of 1990 --until 2020
          python analysis-engine/graph_engine.py

      - name: Verify strict backtest guard
        run: |
          if node analysis-engine/backtest_engine.js --as-of 1990 --until 2020 --strict; then
            echo "Strict backtest unexpectedly succeeded without edge timestamps"
            exit 1
          else
            code=$?
            [ "$code" -eq 2 ]
          fi

      - name: Run all quality gates
        run: sh tools/git-hooks/pre-commit

      - name: Check patch whitespace
        run: git diff --check
