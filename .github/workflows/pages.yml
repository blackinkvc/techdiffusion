name: Deploy main and skylan Pages

on:
  push:
    branches: [main, skylan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Check out skylan preview
        uses: actions/checkout@v4
        with:
          ref: skylan
          path: source-skylan

      - name: Package main site and skylan preview
        run: |
          mkdir -p public/skylan
          rsync -a --exclude='.git' --exclude='.github' --exclude='.runtime' source-main/ public/
          rsync -a --exclude='.git' --exclude='.github' --exclude='.runtime' source-skylan/ public/skylan/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
