<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术演化数据库 · 人类文明科技发展脉络</title>
<meta name="description" content="从用火到智能，梳理人类技术发展的可视化数据库：分类检索、时间轴、环环相扣的科技树。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site-header">
  <!-- 顶部：品牌 + 导航 -->
  <div class="header-top">
    <div class="brand">
      <div class="logo" aria-hidden="true">墨</div>
      <div class="brand-text">
        <h1>技术演化数据库</h1>
        <p class="tagline">Humanity Technology Evolution Archive</p>
      </div>
    </div>
    <nav class="nav-main" id="nav-main">
      <a href="#" class="active" data-view="worldview">首页</a>
      <a href="#" data-view="browse">技术检索</a>
      <a href="#" data-view="timeline">时间轴</a>
      <a href="#" data-view="tree">科技树</a>
      <a href="#" data-view="lineage">来龙去脉</a>
      <a href="#" data-view="method">方法论</a>
      <a href="#" data-view="midtech">中间技术</a>
      <a href="#" data-view="progress">进度</a>
      <a href="#" data-view="sop">研发SOP</a>
      <a href="#" data-view="analysis">关系网分析</a>
    </nav>
  </div>

  <!-- 面包屑 / 卷宗编号 -->
  <div class="breadcrumb">
    <span class="file-no">FILE NO. TECH-EVOLUTION-DB</span>
    <span class="sep">/</span>
    <span>技术演化数据库</span>
    <span class="sep">·</span>
    <span>卷首</span>
  </div>

  <!-- 搜索栏 -->
  <div class="search-row">
    <button id="hist-back" class="hist-btn" title="后退" disabled>←</button>
    <button id="hist-fwd" class="hist-btn" title="前进" disabled>→</button>
    <label for="globalSearch">检索</label>
    <input id="globalSearch" type="search" placeholder="搜索技术 / 人物 / 关键词…" autocomplete="off">
  </div>
</header>

<main id="main">
  <!-- 世界观 / 卷首 -->
  <section id="view-worldview" class="view active">
    <div class="prose" id="worldview-content"></div>
    <div class="stats-line" id="stats-line"></div>
    <div class="stats-grid" id="stats-grid"></div>
    <div class="legend" id="legend"></div>
  </section>

  <!-- 分类检索 -->
  <section id="view-browse" class="view">
    <div class="section-head"><h2>技术检索</h2></div>
    <div class="filter-bar" id="filter-bar"></div>
    <div class="result-meta" id="browse-meta"></div>
    <div class="card-grid" id="card-grid"></div>
  </section>

  <!-- 时间轴 -->
  <section id="view-timeline" class="view">
    <div class="section-head"><h2>时间轴</h2></div>
    <div class="timeline-controls" id="timeline-controls"></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 科技树 -->
  <section id="view-tree" class="view">
    <div class="section-head"><h2>科技依赖树</h2></div>
    <div class="tree-toolbar" id="tree-toolbar"></div>
    <div class="tree-layout">
      <div class="tree-canvas-wrap">
        <svg id="tree-svg"></svg>
        <div class="tree-hint">拖动节点排布 · 滚轮缩放 · 点击节点查看详情与依赖链</div>
      </div>
      <aside class="tree-side" id="tree-side"></aside>
    </div>
  </section>

  <!-- 来龙去脉推演 -->
  <section id="view-lineage" class="view">
    <div class="section-head"><h2>来龙去脉推演</h2></div>
    <div class="lineage-controls">
      <span class="fg-label">选定技术</span>
      <select id="lineage-select" class="lineage-select"></select>
      <span class="lineage-hint">图示：<b>左为技术背景（来龙）</b>，<b>右为衍生应用（去脉）</b>；点击任意节点可切换推演中心</span>
    </div>
    <div class="lineage-layout">
      <div class="lineage-canvas-wrap">
        <svg id="lineage-svg"></svg>
      </div>
      <aside class="lineage-side" id="lineage-side"></aside>
    </div>
  </section>

  <!-- 方法论 -->
  <section id="view-method" class="view">
    <div class="section-head"><h2>方法论</h2></div>
    <div class="method-doc" id="method-doc"></div>
  </section>

  <!-- 中间技术 -->
  <section id="view-midtech" class="view">
    <div class="section-head"><h2>中间技术</h2></div>
    <div class="mid-doc" id="mid-doc"></div>
  </section>

  <!-- 开发进度 -->
  <section id="view-progress" class="view">
    <div class="section-head"><h2>开发进度</h2></div>
    <div class="prog-doc" id="prog-doc"></div>
  </section>

  <!-- 研发 SOP -->
  <section id="view-sop" class="view">
    <div class="section-head"><h2>研发 SOP</h2></div>
    <div class="sop-doc" id="sop-doc"></div>
  </section>

  <!-- 关系网分析 -->
  <section id="view-analysis" class="view">
    <div class="section-head"><h2>关系网分析</h2></div>
    <div class="an-doc" id="an-doc"></div>
  </section>
</main>

<!-- 详情弹窗 -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" id="modal-card"></div>
</div>

<footer class="site-footer">
  <span>技术演化数据库 · 科幻科技实现蓝图（现实锚点层）</span>
  <span id="footer-count"></span>
</footer>

<script src="assets/d3.v7.min.js"></script>
<script src="assets/techs_extra.js"></script>
<script src="assets/techs_extend.js"></script>
<script src="assets/techs_more.js"></script>
<script src="assets/techs_midtech.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
