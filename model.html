<style>
  /* ===== 数学模型页专属样式（在 style.css 基础之上） ===== */
  .model-wrap{max-width:980px;margin:0 auto;padding:8px 18px 60px}
  .model-wrap h2.mh{font-size:25px;margin:38px 0 6px;font-weight:900;letter-spacing:.5px;border-left:5px solid var(--accent);padding-left:12px}
  .model-wrap h3.mh3{font-size:18px;margin:22px 0 6px;font-weight:800;color:var(--ink)}
  .model-wrap p{font-size:14.5px;line-height:1.8;color:var(--ink)}
  .model-wrap .mut{color:var(--ink-soft);font-size:13px}
  .eq{background:var(--accent-bg);border-left:3px solid var(--accent);padding:11px 16px;margin:12px 0;border-radius:0 6px 6px 0;overflow-x:auto;font-size:15px;line-height:2;font-family:"Cambria Math","Times New Roman",serif}
  .eq .var{font-style:italic;color:#6b4f12}
  .frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .25em}
  .frac .num{border-bottom:1px solid var(--ink);padding:0 .35em}
  .frac .den{padding:0 .35em}
  sub,sup{font-size:.72em}
  .concept{display:block;border:1px solid var(--line-light);border-radius:10px;padding:16px 18px;margin:16px 0;background:#fffdf7}
  .concept .ct{font-weight:800;font-size:16px;color:var(--accent);margin-bottom:4px}
  .concept .ct small{font-weight:600;color:var(--ink-soft);font-size:12px}
  .ptable{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
  .ptable th,.ptable td{border:1px solid var(--line-light);padding:6px 9px;text-align:left;vertical-align:top}
  .ptable th{background:var(--accent-bg);font-weight:700}
  .ptable td.sym{font-style:italic;font-family:"Cambria Math",serif;white-space:nowrap;color:#6b4f12;font-weight:700}
  .chart-card{border:1px solid var(--line-light);border-radius:10px;padding:14px 16px;margin:14px 0;background:#fffdf7}
  .chart-card .ctitle{font-weight:700;font-size:14px;margin-bottom:2px}
  .chart-card .csub{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
  .chart-card svg{width:100%;height:auto;display:block}
  .verdict{display:inline-block;font-weight:700;font-size:12.5px;border-radius:20px;padding:2px 12px;margin-left:8px;vertical-align:middle}
  .verdict.pass{background:#e3f3e7;color:#1f7a3d}
  .verdict.partial{background:#fdf0d8;color:#9a6a00}
  .verdict.fail{background:#fbe0e0;color:#b3261e}
  .mlog{position:relative;margin:10px 0 10px 8px;border-left:2px solid var(--line-light);padding-left:18px}
  .mlog .me{position:relative;padding:0 0 18px 0}
  .mlog .me::before{content:"";position:absolute;left:-25px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--accent);opacity:.85}
  .mlog .mv{font-weight:800;font-size:13.5px;color:var(--accent)}
  .mlog .md{font-size:13px;color:var(--ink-soft)}
  .mlog .mb{font-size:13.5px;color:var(--ink);margin-top:3px;line-height:1.7}
  .note{background:#fff8e8;border:1px dashed var(--accent);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:13px;color:#5a4410}
  .pill{display:inline-block;background:var(--accent-bg);border:1px solid var(--line-light);border-radius:14px;padding:2px 11px;font-size:12px;margin:2px;color:#6b4f12}
  .floop{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0;font-size:13px}
  .floop .fb{background:#fff8e8;border:1px solid var(--accent);border-radius:8px;padding:7px 11px;color:#5a4410;line-height:1.5}
  .floop .fa{color:var(--accent);font-weight:900;font-size:16px}
  .latent{display:inline-block;background:#fdeaf2;border:1px solid #c98aa6;border-radius:6px;padding:1px 8px;font-size:12px;color:#8a2d52}
  .mcard{border:1px solid var(--line-light);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin:14px 0;background:#fffdf7}
  .mch{font-weight:800;font-size:15.5px;color:var(--ink);margin-bottom:6px}
  .mch .mid{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;margin-right:6px}
  .mkind{font-weight:600;font-size:12px;color:var(--ink-soft);margin-left:6px}
  .mrow{display:flex;gap:10px;margin:7px 0;font-size:13.5px;line-height:1.7}
  .mlbl{flex:0 0 78px;font-weight:700;color:var(--accent);font-size:12.5px;padding-top:1px}
  .mval{flex:1}
  .mhw{margin-top:6px;font-size:12.5px;color:var(--ink-soft)}
  .hw{display:inline-block;border-radius:6px;padding:1px 9px;font-size:11.5px;font-weight:700}
  .hw.gpu{background:#e7e0ff;color:#4b2ea8}
  .hw.cpu{background:#e3f3e7;color:#1f7a3d}
  .hw.tpu{background:#ffe6e0;color:#b3401f}
  .toc{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
  .toc a{font-size:13px;border:1px solid var(--line-light);border-radius:16px;padding:5px 13px;background:#fff}
  .toc a:hover{background:var(--accent-bg);font-weight:700}
  .kpi-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
  .kpi{flex:1 1 130px;border:1px solid var(--line-light);border-radius:10px;padding:10px 12px;background:#fffdf7;text-align:center}
  .kpi b{display:block;font-size:22px;color:var(--accent);font-weight:900}
  .kpi span{font-size:11.5px;color:var(--ink-soft)}
  .axis text{font-size:11px;fill:var(--ink-soft)}
  .axis line,.axis path{stroke:var(--line-light)}
  .grid line{stroke:#eee6d2}
</style>
</head>
